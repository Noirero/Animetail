name: Pair Extraordinaire helper

on:
  push:
    branches:
      - achievement/pair-extraordinaire

permissions:
  contents: write

jobs:
  coauthor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: achievement/pair-extraordinaire
      - name: Create co-authored marker commit
        shell: bash
        run: |
          if [ -f pair-extraordinaire.txt ]; then
            echo "Marker already exists; nothing to do."
            exit 0
          fi

          printf '%s\n' "Pair Extraordinaire qualification marker." > pair-extraordinaire.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pair-extraordinaire.txt
          git commit -m "Add Pair Extraordinaire marker

          Co-authored-by: Noirero <149634319+Noirero@users.noreply.github.com>"
          git push
